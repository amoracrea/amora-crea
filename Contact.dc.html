<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sending: false, sent: false, error: '' };

  onSubmit = (e) => {
    e.preventDefault();
    const form = e.target;
    const data = new FormData(form);
    this.setState({ sending: true, error: '' });
    fetch('https://formspree.io/f/myeylpzo', {
      method: 'POST',
      body: data,
      headers: { Accept: 'application/json' }
    })
      .then(r => r.json().then(j => ({ ok: r.ok, j })))
      .then(({ ok, j }) => {
        if (ok) {
          this.setState({ sending: false, sent: true });
          form.reset();
        } else {
          const msg = (j.errors && j.errors.map(x => x.message).join(', ')) || 'No pudimos enviar tu consulta.';
          this.setState({ sending: false, error: msg });
        }
      })
      .catch(() => this.setState({
        sending: false,
        error: 'Hubo un problema de conexión. Probá de nuevo o escribime por WhatsApp.'
      }));
  };

  renderVals() {
    return {
      onSubmit: this.onSubmit,
      sending: this.state.sending,
      buttonLabel: this.state.sending ? 'ENVIANDO…' : 'ENVIAR CONSULTA',
      successMsg: this.state.sent ? '¡Gracias! Recibí tu consulta y te respondo a la brevedad.' : '',
      errorMsg: this.state.error
    };
  }
}
</script>
