<nav class="nav">
  <a class="nav-brand" href="index.html" style="text-decoration:none;color:inherit"><img src="assets/logo-amora.png" alt="Amora Crea" style="height:22px;width:auto;display:block"></a>

<div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px)">

  <section style="padding:48px 0 16px">
    <a href="ArtShop.dc.html" style="font-size:13px;text-decoration:none">← Volver a Obras</a>
  </section>

  <section data-stack-mobile style="display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:48px;align-items:start;padding:16px 0 64px">
    <x-import component-from-global-scope="ProductGallery" from="./ProductGallery.jsx" images="{{ imagenes }}" autoplay="5000" arrows="{{ false }}" hint-size="100%,560px"></x-import>
    <div>
      <h1 style="font-size:clamp(30px,4vw,44px);line-height:1.05;letter-spacing:-0.02em;margin:0 0 8px">{{ titulo }}</h1>
      <p style="font-size:14px;color:color-mix(in srgb, var(--color-text) 65%, transparent);margin:0 0 24px">{{ tecnica }}</p>
      <p style="font-size:16px;line-height:1.65;max-width:48ch;color:color-mix(in srgb, var(--color-text) 82%, transparent);margin:0 0 32px">{{ descripcion }}</p>
      <sc-if value="{{ disponible }}" hint-placeholder-val="{{ true }}">
        <a href="{{ waHref }}" class="btn btn-secondary">CONSULTAR POR WHATSAPP</a>
      </sc-if>
      <sc-if value="{{ vendida }}">
        <button type="button" class="btn btn-secondary" disabled>VENDIDA</button>
      </sc-if>
    </div>
  </section>

</div>

<div style="max-width:1200px;margin:0 auto;padding:32px clamp(20px,5vw,72px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:2px solid var(--color-divider)">
  <span style="font-size:13px;color:color-mix(in srgb, var(--color-text) 70%, transparent)">© AMORA CREA</span>
  <div style="display:flex;gap:16px;font-size:13px">
    <a href="Contact.dc.html">Contacto</a>
    <a href="https://instagram.com/amora.crea">@amora.crea</a>
  </div>
</div>
]]>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { obra: null };
  componentDidMount() {
    const slug = new URLSearchParams(location.search).get('o');
    window.AmoraContent.load('obras', 'obras').then((list) => {
      const obra = (list || []).find((o) => o.slug === slug) || (list || [])[0] || null;
      this.setState({ obra });
      if (obra) document.title = obra.titulo + ' — Amora Crea';
    });
  }
  renderVals() {
    const o = this.state.obra;
    if (!o) return { titulo: '', tecnica: '', descripcion: '', imagenes: [], disponible: false, vendida: false, waHref: '#' };
    const vendida = o.estado === 'vendida';
    return {
      titulo: o.titulo,
      tecnica: o.tecnica,
      descripcion: o.descripcion,
      imagenes: o.imagenes || [],
      disponible: !vendida,
      vendida: vendida,
      waHref: window.AmoraContent.wa('Hola Amora! Me interesa la obra ' + o.titulo)
    };
  }
}</script>
</body>
</html>
